spring.application.name=project
# Load .env from project root (two levels up from Backend/src/main/resources)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/JobPortal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ISI3eng@2026}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

app.jwtSecret=KoraSecretKeyForJwtAuthenticationWhichNeedsToBeVeryLongToSatisfyHS512
app.jwtExpirationMs=86400000

app.scheduler.expiry.cron=0 0 0 * * *

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=kora-async-

logging.level.JobPortal.project=${LOGGING_LEVEL_KORA:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_BINDER:INFO}

# Cloudinary Config
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# OAuth2 Config
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/calendar.events
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code


# Mail Config
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
# Google Cloud AI Config
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:YOUR_GCP_PROJECT_ID}
google.cloud.location=${GOOGLE_CLOUD_LOCATION:us-central1}

# Central Google Calendar Integration
app.google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
app.google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
app.google.calendar.refresh-token=${GOOGLE_CALENDAR_REFRESH_TOKEN:}
